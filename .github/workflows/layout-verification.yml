name: Production layout verification

on:
  pull_request:
    paths:
      - app/**
      - scripts/smoke_layout.mjs
      - scripts/smoke_browser_session.mjs
      - .github/workflows/layout-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    # Only trusted repository branches can use the existing smoke account.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the candidate for layout verification
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          NEXT_PUBLIC_BACKEND_URL: https://roleforge-api-224015900616.us-central1.run.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.ROLEFORGE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ROLEFORGE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Start the candidate on the runner
        if: github.event_name == 'pull_request'
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/layout-server.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3100/help -o /dev/null
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          NEXT_PUBLIC_BACKEND_URL: https://roleforge-api-224015900616.us-central1.run.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.ROLEFORGE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ROLEFORGE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify layouts against the candidate or deployed site
        run: npm run smoke:layout -- --require-chrome --require-signed-in-layout
        env:
          ROLEFORGE_SITE_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:3100' || 'https://roleforgeai.vercel.app' }}
          ROLEFORGE_SMOKE_COOKIE: ${{ secrets.ROLEFORGE_SMOKE_COOKIE }}
          ROLEFORGE_SUPABASE_URL: ${{ vars.ROLEFORGE_SUPABASE_URL }}
          ROLEFORGE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ROLEFORGE_SUPABASE_PUBLISHABLE_KEY }}
          ROLEFORGE_SMOKE_EMAIL: ${{ secrets.ROLEFORGE_SMOKE_EMAIL }}
          ROLEFORGE_SMOKE_PASSWORD: ${{ secrets.ROLEFORGE_SMOKE_PASSWORD }}
