name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://roleforge-api-224015900616.us-central1.run.app
          NEXT_PUBLIC_SITE_URL: https://roleforgeai.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Wait for Vercel deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run wait:vercel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLEFORGE_SITE_URL: https://roleforgeai.vercel.app

      - name: Smoke production shell
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run smoke:frontend -- --require-signed-in-smoke --require-backend-workflow-smoke
        env:
          ROLEFORGE_BACKEND_URL: https://roleforge-api-224015900616.us-central1.run.app
          ROLEFORGE_SMOKE_COOKIE: ${{ secrets.ROLEFORGE_SMOKE_COOKIE }}
          ROLEFORGE_SUPABASE_URL: ${{ vars.ROLEFORGE_SUPABASE_URL }}
          ROLEFORGE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ROLEFORGE_SUPABASE_PUBLISHABLE_KEY }}
          ROLEFORGE_SMOKE_EMAIL: ${{ secrets.ROLEFORGE_SMOKE_EMAIL }}
          ROLEFORGE_SMOKE_PASSWORD: ${{ secrets.ROLEFORGE_SMOKE_PASSWORD }}
          ROLEFORGE_REQUIRE_SIGNED_IN_SMOKE: ${{ vars.ROLEFORGE_REQUIRE_SIGNED_IN_SMOKE }}
          ROLEFORGE_EXPECT_PREMIUM_ACCESS: ${{ vars.ROLEFORGE_EXPECT_PREMIUM_ACCESS }}

      - name: Smoke rendered production layout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run smoke:layout -- --require-chrome --require-signed-in-layout
        env:
          ROLEFORGE_SITE_URL: https://roleforgeai.vercel.app
          ROLEFORGE_SMOKE_COOKIE: ${{ secrets.ROLEFORGE_SMOKE_COOKIE }}
          ROLEFORGE_SUPABASE_URL: ${{ vars.ROLEFORGE_SUPABASE_URL }}
          ROLEFORGE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ROLEFORGE_SUPABASE_PUBLISHABLE_KEY }}
          ROLEFORGE_SMOKE_EMAIL: ${{ secrets.ROLEFORGE_SMOKE_EMAIL }}
          ROLEFORGE_SMOKE_PASSWORD: ${{ secrets.ROLEFORGE_SMOKE_PASSWORD }}
